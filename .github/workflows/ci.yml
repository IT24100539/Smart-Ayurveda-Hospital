name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore, build, test
        working-directory: backend
        run: |
          dotnet restore Hospital.sln
          dotnet build Hospital.sln --no-restore --configuration Release
          dotnet test Hospital.sln --no-build --configuration Release

  agent-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        working-directory: agent-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest

  web-staff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-staff/package-lock.json
      - name: Install, test, build
        working-directory: web-staff
        run: |
          npm ci
          npm test
          npm run build

  mobile-patient:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Test
        working-directory: mobile-patient
        run: flutter test
