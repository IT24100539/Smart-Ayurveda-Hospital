<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Ayurveda — staff wireframes</title>
  <style>
    body { font-family: Georgia, serif; background: #f7f3ea; color: #1d2a22; margin: 0; padding: 2rem; }
    h1 { color: #1b4332; }
    .frame { background: white; border: 1px solid #d9e2d7; border-radius: 12px; padding: 1.5rem; max-width: 720px; margin: 1rem 0 2rem; }
    .nav { background: #1b4332; color: #e9f5ee; padding: 0.8rem 1rem; border-radius: 8px; margin-bottom: 1rem; }
    label { display: block; margin-top: 0.8rem; font-size: 0.9rem; }
    input { width: 100%; padding: 0.5rem; }
    button { margin-top: 1rem; background: #1b4332; color: white; border: 0; padding: 0.6rem 1rem; }
  </style>
</head>
<body>
  <h1>Staff portal wireframes</h1>
  <p>Low-fidelity HTML for the React app in <code>web-staff/</code>.</p>

  <h2>1. Sign in</h2>
  <div class="frame">
    <strong>Smart Ayurveda</strong>
    <p>Staff portal</p>
    <label>Email</label><input value="admin@smartayurveda.local" />
    <label>Password</label><input type="password" />
    <button>Sign in</button>
  </div>

  <h2>2. Dashboard</h2>
  <div class="frame">
    <div class="nav">Dashboard · Patients · Appointments</div>
    <p>Appointments today · Checked in · Therapies · Open invoices</p>
  </div>
</body>
</html>
