<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Ayurveda — Staff</title>
    <link rel="icon" type="image/svg+xml" href="/brand/leaf-mark.svg" />
    <script>
      // Apply the saved theme before first paint to avoid a light flash. Keep in sync with src/store/themeStore.ts.
      (function () {
        try {
          var saved = localStorage.getItem("sah-staff-theme");
          var pref = saved === "light" || saved === "dark" ? saved : "system";
          var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
